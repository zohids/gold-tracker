name: Update daily gold prices

on:
  schedule:
    - cron: '0 6 * * *' # 11:00 Asia/Tashkent (UTC+5)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/update-prices.js
      - name: Commit updated price history
        run: |
          if git diff --quiet -- gold-prices.sqlite; then
            echo "No price changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold-prices.sqlite
          git commit -m "Update daily gold price history"
          git push
