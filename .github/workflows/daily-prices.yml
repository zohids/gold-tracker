name: Update prices and publish site

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 6 * * *' # 11:00 Asia/Tashkent (UTC+5)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch daily gold prices and export static history
        # Prefer IPv4 if the hosted runner's IPv6 route to CBU is unreachable.
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: npm run update
      - name: Commit updated price history
        run: |
          if ! git diff --quiet -- gold-prices.sqlite public/data/history.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gold-prices.sqlite public/data/history.json
            git commit -m "Update daily gold price history"
            git push
          fi
      - name: Check out latest main before publishing
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
